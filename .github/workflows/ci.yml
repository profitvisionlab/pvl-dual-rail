name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zero dependencies — no install step. The smoke suite is fully offline
      # (enterprise rail uses ENTERPRISE_ADAPTER=mock; no keys required).
      - run: npm test
